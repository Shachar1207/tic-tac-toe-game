<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- USERNAME SCREEN -->
    <div class="screen" id="usernameScreen">
        <div class="card username-container">
            <div class="title">TIC TAC TOE</div>
            <div class="subtitle">Enter player names</div>

            <div class="input-group player-x">
                <label>⬡ Player X</label>
                <input type="text" id="player1Input" placeholder="Enter name..." maxlength="20">
            </div>

            <div class="vs-divider">— VS —</div>

            <div class="input-group player-o">
                <label>⬡ Player O</label>
                <input type="text" id="player2Input" placeholder="Enter name..." maxlength="20">
            </div>

            <button class="btn btn-primary" id="startGameBtn">Start Game</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div class="screen hidden" id="gameScreen">
        <div class="card">
            <div class="title">TIC TAC TOE</div>

            <!-- Scores -->
            <div class="score">
                <div class="score-box" id="scoreBoxX">
                    <span class="score-name" id="nameX">Player X</span>
                    <span class="score-number" id="scoreXNum">0</span>
                </div>
                <div class="score-box draws">
                    <span class="score-name">Draw</span>
                    <span class="score-number" id="scoreDraw">0</span>
                </div>
                <div class="score-box" id="scoreBoxO">
                    <span class="score-name" id="nameO">Player O</span>
                    <span class="score-number" id="scoreONum">0</span>
                </div>
            </div>

            <!-- Status -->
            <div class="status" id="status">Player X's Turn</div>

            <!-- Timer bar -->
            <div class="timer-bar-wrap">
                <div class="timer-bar" id="timerBar"></div>
            </div>
            <div class="timer-text" id="timerText">30s</div>

            <!-- Board -->
            <div class="board" id="board">
                <div class="square" data-index="0"></div>
                <div class="square" data-index="1"></div>
                <div class="square" data-index="2"></div>
                <div class="square" data-index="3"></div>
                <div class="square" data-index="4"></div>
                <div class="square" data-index="5"></div>
                <div class="square" data-index="6"></div>
                <div class="square" data-index="7"></div>
                <div class="square" data-index="8"></div>
            </div>

            <!-- Buttons -->
            <div class="button-row">
                <button class="btn btn-secondary" id="newGameBtn">New Game</button>
                <a href="leaderboard.html" class="btn btn-primary">🏆 Leaderboard</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
